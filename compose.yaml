# FestPass three-tier stack - REGNO 202401100100160, PORT 8060
#
#   browser --8060--> frontend (nginx) --frontend-net--> backend (Flask) --backend-net--> db (PostgreSQL)
#
# Only the backend is attached to both networks, so the frontend cannot reach the database.
name: festpass

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      REGNO: "202401100100160"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  frontend:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "8060:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-net

networks:
  frontend-net:
  backend-net:
    # No route out of this network: the database only ever talks to the backend.
    internal: true

volumes:
  db-data:
